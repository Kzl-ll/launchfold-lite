heading: "Questions before you join"
items:
  - question: "Will it slow down my app?"
    answer: "The widget loads a small async script, so it never blocks your app's own load time."
    objection: "trust"
  - question: "I don't have time to write release notes."
    answer: "Most founders write an update in under five minutes because it's plain markdown, not a formatted document."
    objection: "effort"
  - question: "What happens to the price after beta?"
    answer: "Early-bird founders keep $5/month for life. New signups after beta pay the regular $12/month."
    objection: "price"
  - question: "Does it work with my stack?"
    answer: "Shipnote is one script tag, so it works with any stack that can render HTML - no framework required."
    objection: "fit"
